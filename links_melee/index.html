<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Link's Melee | Castle Duel</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1321;color:#ead8af;font:14px system-ui;text-align:center}header{padding:8px;font-size:21px;font-weight:900;letter-spacing:2px}header small{font-size:12px;color:#b5b4ba;letter-spacing:0}canvas{display:block;width:min(100%,1100px);aspect-ratio:16/9;margin:auto;image-rendering:pixelated;border:3px solid #ac8d5e;box-shadow:0 16px 50px #000b;touch-action:none}.hint{margin:7px 6px;color:#c5c8cc}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;padding:8px}button{background:#28364b;border:1px solid #9e886c;border-radius:7px;color:white;padding:13px 17px;font-size:15px;font-weight:700;touch-action:none;user-select:none}button:active{background:#657b95}footer{font-size:12px;color:#a9b5c4;padding:8px}</style></head><body><header>LINK'S MELEE <small>v0.2 · Castle Duel</small></header><canvas id="game" width="960" height="540"></canvas><div class="hint">A / D move · W jump · J attack · K block · L heavy attack · R restart</div><div class="controls"><button data-k="a">◀</button><button data-k="d">▶</button><button data-k="w">JUMP</button><button data-k="j">STRIKE</button><button data-k="k">BLOCK</button><button data-k="l">HEAVY</button><button id="restart">RESTART</button></div><footer>Playable offline · Swordsman vs Dark Swordsman · Single-stage prototype · Combat update</footer><script>
(()=>{
const canvas=document.getElementById('game'),c=canvas.getContext('2d');c.imageSmoothingEnabled=false;const W=960,H=540,FLOOR=438;
const assets={};let loaded=0;const files=['castle_arena.jpg',...Array.from({length:6},(_,i)=>`swordsman_${i}.png`),...Array.from({length:6},(_,i)=>`dark_${i}.png`)];files.forEach(f=>{let im=new Image;im.onload=()=>loaded++;im.src=f;assets[f]=im});
const keys={};let just={};const key=k=>!!keys[k];let player,foe,particles,clock,round,notice,shake,aiTick;
function reset(){player={x:220,y:FLOOR,w:72,h:135,vx:0,vy:0,face:1,hp:100,stamina:100,atk:0,heavy:false,cool:0,block:false,inv:0,stun:0,combo:0};foe={x:730,y:FLOOR,w:72,h:135,vx:0,vy:0,face:-1,hp:100,stamina:100,atk:0,heavy:false,cool:0,block:false,inv:0,stun:0,combo:0};particles=[];clock=90*60;round='play';notice='CASTLE DUEL';shake=0;aiTick=0;just={}}
reset();document.getElementById('restart').onclick=reset;
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k.startsWith('arrow'))k={arrowleft:'a',arrowright:'d',arrowup:'w'}[k]||k;if(k===' ')k='w';if(['a','d','w','j','k','l'].includes(k))e.preventDefault();if(k==='r')reset();if(!keys[k])just[k]=true;keys[k]=true});document.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k.startsWith('arrow'))k={arrowleft:'a',arrowright:'d',arrowup:'w'}[k]||k;if(k===' ')k='w';keys[k]=false});
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;for(let [evt,on] of [['pointerdown',true],['pointerup',false],['pointercancel',false],['pointerleave',false]])b.addEventListener(evt,e=>{e.preventDefault();if(on&&!keys[k])just[k]=true;keys[k]=on})});
function attack(a,b,heavy){if(a.cool||a.stun||round!=='play')return;if(heavy&&a.stamina<32)return;a.heavy=heavy;a.atk=heavy?24:15;a.cool=heavy?40:24;a.stamina-=heavy?32:9;a.didHit=false;a.block=false;a.combo=(a.combo+1)%3}
function hit(a,b){let range=a.heavy?125:96;let delta=b.x-a.x;if(a.didHit||Math.abs(delta)>range||Math.sign(delta)!==a.face||Math.abs(b.y-a.y)>85)return;a.didHit=true;let blocked=b.block&&b.face===-a.face;let damage=a.heavy?20:11;if(blocked){damage=Math.ceil(damage*.18);b.stamina=Math.max(0,b.stamina-17);if(b.stamina===0)b.block=false}b.hp=Math.max(0,b.hp-damage);b.inv=12;b.stun=blocked?4:13;b.vx=a.face*(blocked?2.2:7.5);shake=blocked?2:5;for(let i=0;i<14;i++)particles.push({x:b.x,y:b.y-78,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,life:22,color:blocked?'#a8d8fa':'#f9c987'});notice=blocked?'GUARDED':a.heavy?'HEAVY HIT':'STRIKE';if(b.hp<=0){shake=0;round=a===player?'win':'lose';notice=round==='win'?'VICTORY — DARK SWORDSMAN DEFEATED':'DEFEAT — TRY AGAIN'}}
function physics(a){a.cool=Math.max(0,a.cool-1);a.inv=Math.max(0,a.inv-1);a.stun=Math.max(0,a.stun-1);a.stamina=Math.min(100,a.stamina+(a.block?.13:.35));if(a.atk){a.atk--;let elapsed=(a.heavy?24:15)-a.atk;if(elapsed===(a.heavy?13:7))hit(a,a===player?foe:player)}a.vy+=.7;a.y+=a.vy;if(a.y>FLOOR){a.y=FLOOR;a.vy=0}a.x=Math.max(50,Math.min(910,a.x+a.vx));a.vx*=a.y===FLOOR?.77:.94}
function update(){if(round!=='play')return;clock--;if(clock<=0){shake=0;round=player.hp>=foe.hp?'win':'lose';notice=round==='win'?'TIME — VICTORY':'TIME — DEFEAT'}if(!player.stun){player.block=key('k')&&!player.atk&&player.stamina>0;let move=(key('d')?1:0)-(key('a')?1:0);if(move&&!player.block){player.vx=move*4.7;player.face=move}if(just.w&&player.y===FLOOR)player.vy=-13;if(just.j)attack(player,foe,false);if(just.l)attack(player,foe,true)}else player.block=false;

 aiTick++;let dx=player.x-foe.x,dist=Math.abs(dx);foe.face=Math.sign(dx)||-1;
 // Opening grace period and measured footwork: the opponent probes rather than rushing.
 if(!foe.stun){
  let active=aiTick>115,ideal=foe.hp<35?135:175;
  if(!active){foe.vx*=.75;foe.block=false}
  else if(dist>ideal+45){foe.vx=Math.sign(dx)*(foe.hp<35?2.5:1.65);foe.block=false}
  else if(dist<105){foe.vx=-Math.sign(dx)*1.35;foe.block=player.atk>0&&foe.stamina>20&&aiTick%4!==0}
  else{foe.vx*=.68;foe.block=player.atk>0&&dist<150&&foe.stamina>20&&aiTick%3===0}
  if(active&&dist<140&&foe.cool===0&&aiTick%75===0&&!foe.block)attack(foe,player,aiTick%225===0);
 }

 if(player.x<foe.x){player.face=key('a')?-1:key('d')?1:player.face}else{player.face=key('a')?-1:key('d')?1:player.face}
 physics(player);physics(foe);if(Math.abs(player.x-foe.x)<64){let overlap=64-Math.abs(player.x-foe.x),dir=player.x<foe.x?-1:1;player.x+=dir*overlap*.5;foe.x-=dir*overlap*.5}particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.life--});particles=particles.filter(p=>p.life>0);shake=Math.max(0,shake-1);just={}}
function text(t,x,y,size=20,color='#fff2cd',align='center'){c.font=`bold ${size}px system-ui`;c.textAlign=align;c.fillStyle='#111b27';c.fillText(t,x+2,y+2);c.fillStyle=color;c.fillText(t,x,y)}
function bar(x,y,hp,stam,reverse=false){c.fillStyle='#0b1220d9';c.fillRect(x-5,y-5,355,49);c.fillStyle='#293341';c.fillRect(x,y,340,19);c.fillStyle=hp>30?'#cb5c5a':'#ec925e';let w=340*Math.max(0,hp)/100;c.fillRect(reverse?x+340-w:x,y,w,19);c.fillStyle='#34404d';c.fillRect(x,y+25,340,7);c.fillStyle='#6ec5d7';let sw=340*stam/100;c.fillRect(reverse?x+340-sw:x,y+25,sw,7);c.strokeStyle='#d8c59b';c.lineWidth=2;c.strokeRect(x,y,340,19)}
function fighter(a,dark){let id=a.block?4:a.atk?(a.heavy?3:3):Math.abs(a.vx)>1.2?((Math.floor(performance.now()/120)%2)?1:2):a.y<FLOOR?5:0;let im=assets[(dark?'dark_':'swordsman_')+id+'.png'];if(!im||!im.complete||!im.naturalWidth)return;let h=a.block?142:148,w=im.width/im.height*h;if(id===3)w*=1.1;c.save();c.translate(Math.round(a.x),Math.round(a.y));if(a.face<0)c.scale(-1,1);if(a.inv>0&&a.inv%4<2)c.globalAlpha=.58;c.fillStyle='#0b0e1b8c';c.beginPath();c.ellipse(0,2,42,9,0,0,Math.PI*2);c.fill();if(dark){c.shadowColor='#a35bf9';c.shadowBlur=22}c.drawImage(im,-w*.5,-h,w,h);c.shadowBlur=0;if(a.atk>0){
 // Frame-based arm/sword movement: a blade silhouette rotates with the attack.
 let duration=a.heavy?24:15,progress=1-a.atk/duration;
 let angle=(-1.4+progress*2.4),pivotX=26,pivotY=-99;
 c.save();c.translate(pivotX,pivotY);c.rotate(angle);
 c.fillStyle=dark?'#b3a0dc':'#c5dfe8';
 c.beginPath();c.moveTo(-5,0);c.lineTo(5,0);c.lineTo(4,-74);c.lineTo(0,-86);c.lineTo(-4,-74);c.closePath();c.fill();
 c.fillStyle=dark?'#4b316b':'#6b4d35';c.fillRect(-4,1,8,17);
 c.fillStyle='#d6b878';c.fillRect(-14,-2,28,6);
 c.restore();
}if(a.block){c.strokeStyle=dark?'#b29aff':'#94e2ee';c.lineWidth=3;c.beginPath();c.arc(0,-73,57,-.7,.9);c.stroke()}c.restore()}
function render(){c.save();if(shake&&round==='play')c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);let bg=assets['castle_arena.jpg'];if(bg.complete&&bg.naturalWidth)c.drawImage(bg,0,0,W,H);else{c.fillStyle='#1b2838';c.fillRect(0,0,W,H)}fighter(player,false);fighter(foe,true);for(let p of particles){c.globalAlpha=p.life/22;c.fillStyle=p.color;c.fillRect(p.x,p.y,5,5)}c.globalAlpha=1;c.restore();bar(28,20,player.hp,player.stamina);bar(592,20,foe.hp,foe.stamina,true);text('SWORDSMAN',28,85,18,'#f8e0ad','left');text('DARK SWORDSMAN',932,85,18,'#e4baff','right');text(String(Math.max(0,Math.ceil(clock/60))),480,48,38);if(round!=='play'){c.fillStyle='#0a1020cc';c.fillRect(160,155,640,200);text(notice,480,232,33,round==='win'?'#f8d587':'#f1a1a1');text('Press R or RESTART to fight again',480,285,19)}else if(notice!=='CASTLE DUEL'&&Math.floor(performance.now()/1000)%3!==2)text(notice,480,120,21,'#ffe4a8')}
let last=0,acc=0;function loop(now){let dt=Math.min(50,now-last||16.7);last=now;acc+=dt;while(acc>=16.667){update();acc-=16.667}render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
