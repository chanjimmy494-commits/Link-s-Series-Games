<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Link's Adventure · Dojo Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#10141c;color:#f5e8c8;font:14px system-ui,sans-serif}#app{height:100dvh;display:flex;flex-direction:column}header{height:44px;display:flex;align-items:center;justify-content:space-between;padding:4px 12px;background:#18212d;gap:8px}header strong{font-size:15px}header span{font-size:12px;color:#e6d09a}main{position:relative;flex:1;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block;object-fit:contain;background:#24212a}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#090e16a8;z-index:4;padding:12px}.panel{background:#1d2735f5;border:2px solid #c7a76b;border-radius:12px;max-width:440px;width:100%;padding:20px;text-align:center;box-shadow:0 12px 50px #0008}.panel h1{margin:0 0 12px;font-size:25px}.panel p{line-height:1.5}.panel button{margin:6px;padding:12px 18px;border-radius:8px;border:1px solid #d4b875;background:#3b4e60;color:white;font-weight:700;cursor:pointer}.panel button.primary{background:#80632c}.panel small{display:block;color:#c6c3ba;margin-top:10px}.hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#101923d9;padding:7px 13px;border:1px solid #c7a76b;border-radius:8px;z-index:2;text-align:center;white-space:nowrap}.controls{position:absolute;inset:0;pointer-events:none;z-index:3}.pad,.actions{position:absolute;bottom:12px;display:flex;gap:8px;pointer-events:auto}.pad{left:14px}.actions{right:14px}.controls button{touch-action:none;user-select:none;-webkit-user-select:none;background:#33465d26;border:1px solid #b6a57b90;color:#f9e6b9;border-radius:10px;width:clamp(52px,13vh,86px);height:clamp(52px,18vh,96px);font-weight:700;font-size:12px;backdrop-filter:blur(1px)}.pad button{background:#252d3b26}.controls button:active,.controls button.pressed{background:#c5a04b75}.hide{display:none!important}@media(orientation:portrait){header{height:50px}.controls{position:relative;inset:auto;height:128px;background:#131a23}.pad,.actions{bottom:10px}.controls button{width:clamp(48px,13vw,74px);height:92px}.hud{font-size:12px}} 
</style></head>
<body><div id="app"><header><strong>LINK'S ADVENTURE · DOJO</strong><span>Standalone combat prototype · v0.6</span></header><main><canvas id="arena" width="960" height="540"></canvas><div class="hud" id="hud">Training session</div><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div><div class="controls" id="controls"><div class="pad"><button data-key="left" aria-label="Move left">◀</button><button data-key="right" aria-label="Move right">▶</button></div><div class="actions"><button data-key="attack">ATTACK</button><button data-key="block">BLOCK</button><button data-key="jump">JUMP</button></div></div></main></div>
<script>
'use strict';
const canvas=document.querySelector('#arena'),ctx=canvas.getContext('2d'),hud=document.querySelector('#hud'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel');
const W=960,H=540,FLOOR=416,SESSION=60,STANDARD=120,PRICE=80;
const spriteRoot='../links_adventure_0_22_ancient_outpost/Links_Adventure_Ancient_Outpost_Dual_Orientation - Sprites/sprites/';
const counts={idle:4,walk:8,run:8,jump:4,attack:7,block:9};
const sprites={};for(const [action,count] of Object.entries(counts)){sprites[action]=Array.from({length:count},(_,i)=>{let img=new Image();img.src=spriteRoot+action+'_'+String(i).padStart(2,'0')+'.png';return img})}
// Dojo master sprite atlas: 8 columns x 18 rows, 112px square cells.
const masterAtlas=new Image();masterAtlas.src='IMG_2919.png?asset=744515fa83dd-master-v6';masterAtlas.onload=()=>{document.querySelector('header span').textContent='v0.6 · Dojo Master loaded'};masterAtlas.onerror=()=>{document.querySelector('header span').textContent='v0.6 · MASTER IMAGE FAILED'};
const masterActions={idle:[0,5,5],walk:[1,7,11],run:[2,7,14],light:[3,4,12],combo:[4,7,15],upward:[5,4,12],block:[6,4,6],hit:[7,4,10],getup:[8,4,10],turn:[9,3,8],crouch:[10,4,7],jump:[11,5,12],heavy:[12,5,12],thrust:[13,4,12],downward:[14,4,12],parry:[15,4,10],knockdown:[16,5,10],defeat:[17,3,4]};
const held=new Set();let state='menu',clock=0,points=0,hits=0,blocks=0,taken=0,currency=300,exp=0,difficulty=1,player,master,particles=[],last=0,attackWasHeld=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fighter(x,face,masterFlag){return {x,y:FLOOR,vx:0,vy:0,face,hp:100,attack:0,attackHit:false,block:false,stun:0,inv:0,anim:0,master:masterFlag,cooldown:0}}
function showMenu(){state='menu';overlay.classList.remove('hide');panel.innerHTML='<h1>Training Dojo</h1><p>Purchase <b>'+STANDARD+' EXP</b> for <b>'+PRICE+' coins</b>, or spar with the dojo master to earn EXP based on performance. A victory earns a bonus. Losing still earns EXP.</p><p>Coins: <b>'+currency+'</b> · Total EXP: <b>'+exp+'</b></p><button id="buy" class="primary">Buy '+STANDARD+' EXP</button><button id="train">Train for EXP</button><small>Keyboard: A/D move · J attack · K block · Space jump. Touch buttons on mobile.</small>';document.querySelector('#buy').onclick=()=>{if(currency<PRICE){panel.querySelector('small').textContent='Not enough coins.';return}currency-=PRICE;exp+=STANDARD;showMenu()};document.querySelector('#train').onclick=start}
function start(){state='fight';overlay.classList.add('hide');clock=SESSION;points=hits=blocks=taken=0;particles=[];player=fighter(270,1,false);master=fighter(690,-1,true);held.clear();attackWasHeld=false}
function finish(){state='result';held.clear();const won=master.hp<=0&&player.hp>0,loss=player.hp<=0;let base=Math.floor(points/2),bonus=won?90:0,earned=Math.max(10,base+bonus);exp+=earned;overlay.classList.remove('hide');panel.innerHTML='<h1>'+ (won?'Dojo Master Defeated':loss?'Training Defeat':'Training Complete')+'</h1><p>Successful strikes: '+hits+' · Blocks: '+blocks+' · Hits taken: '+taken+'</p><p>Performance points: <b>'+points+'</b></p><p>Training EXP: '+base+' · Victory bonus: '+bonus+'</p><h2>+'+earned+' EXP</h2><p>Total EXP: '+exp+'</p><button class="primary" id="again">Train Again</button><button id="exit">Return to Dojo</button>';document.querySelector('#again').onclick=start;document.querySelector('#exit').onclick=showMenu}
function strike(a,b){if(a.attack||a.cooldown||a.stun)return;a.attack=.37;a.attackHit=false;a.cooldown=.52}
function hit(a,b){if(a.attackHit||a.attack<=0||a.attack>.23||a.attack<.09)return; a.attackHit=true;if(Math.abs(a.x-b.x)>106||Math.abs(a.y-b.y)>72||Math.sign(b.x-a.x)!==a.face)return;
 const defended=b.block&&b.stun<=0;const dmg=defended?4:16;if(b.inv>0)return;b.hp=Math.max(0,b.hp-dmg);b.inv=.23;b.stun=defended?.08:.18;
 if(!a.master){if(defended)points+=6;else{points+=35;hits++}}else if(!defended){points=Math.max(0,points-12);taken++}else{points+=18;blocks++}
 particles.push({x:b.x,y:b.y-94,t:.5,text:defended?'BLOCK':String(dmg),color:defended?'#9ce4ff':'#ffe7a1'})}
function update(dt){if(state!=='fight')return;clock=Math.max(0,clock-dt);
 for(const a of [player,master]){a.anim+=dt;a.attack=Math.max(0,a.attack-dt);a.cooldown=Math.max(0,a.cooldown-dt);a.stun=Math.max(0,a.stun-dt);a.inv=Math.max(0,a.inv-dt);a.vy+=1200*dt;a.y+=a.vy*dt;if(a.y>FLOOR){a.y=FLOOR;a.vy=0}a.x=clamp(a.x,75,W-75)}
 const left=held.has('left'),right=held.has('right');player.block=held.has('block')&&!player.attack;player.vx=player.stun?0:player.block?0:(Number(right)-Number(left))*250;player.x=clamp(player.x+player.vx*dt,75,W-75);
 if(held.has('jump')&&player.y===FLOOR&&!player.block){player.vy=-540;held.delete('jump')}
 if(held.has('attack')&&!attackWasHeld){strike(player,master);attackWasHeld=true}if(!held.has('attack'))attackWasHeld=false;
 const dist=player.x-master.x;master.face=dist<0?-1:1;master.block=false;master.vx=0;
 if(!master.stun){if(Math.abs(dist)>92){master.vx=Math.sign(dist)*(90+25*difficulty);master.x=clamp(master.x+master.vx*dt,75,W-75)}
 else {const cycle=Math.floor((SESSION-clock)*(1.4+.2*difficulty));master.block=(cycle%5===0)&&!master.attack;if(!master.block&&master.cooldown===0)strike(master,player)}}
 if(Math.abs(player.x-master.x)>12)player.face=player.x<master.x?1:-1;
 hit(player,master);hit(master,player);for(const p of particles)p.t-=dt;particles=particles.filter(p=>p.t>0);
 if(clock===0||player.hp===0||master.hp===0)finish()}
const dojoBackground=new Image();dojoBackground.src='IMG_2918.png?asset=744515fa83dd';dojoBackground.onload=()=>{document.querySelector('header span').textContent='v0.3 · New dojo background loaded'};dojoBackground.onerror=()=>{document.querySelector('header span').textContent='v0.3 · BACKGROUND IMAGE FAILED'};
function drawBackdrop(){if(dojoBackground.complete&&dojoBackground.naturalWidth){ctx.drawImage(dojoBackground,0,0,W,H);return}ctx.fillStyle='#151d28';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f0d5a0';ctx.textAlign='center';ctx.font='bold 23px system-ui';ctx.fillText('Loading new dojo background…',W/2,H/2);return;let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a1b28');g.addColorStop(1,'#494037');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#292b36';for(let y=0;y<390;y+=46){for(let x=(Math.floor(y/46)%2)*-50;x<W;x+=102){ctx.fillRect(x+2,y+2,98,42);ctx.strokeStyle='#5e5961';ctx.strokeRect(x+2,y+2,98,42)}}
 ctx.fillStyle='#6e4b32';ctx.fillRect(90,0,38,416);ctx.fillRect(832,0,38,416);ctx.fillRect(0,45,W,25);ctx.fillRect(0,370,W,25);
 ctx.fillStyle='#8c703f';ctx.fillRect(400,70,160,180);ctx.fillStyle='#473044';ctx.fillRect(414,82,132,155);ctx.fillStyle='#cfac64';ctx.fillRect(458,82,44,155);
 ctx.fillStyle='#b4a176';ctx.font='bold 27px Georgia';ctx.textAlign='center';ctx.fillText('HALL OF THE SWORD',480,41);
 for(const x of [185,775]){ctx.fillStyle='#b08b52';ctx.fillRect(x-28,95,56,108);ctx.fillStyle='#65442f';ctx.fillRect(x-23,100,46,97);ctx.fillStyle='#d8c17c';ctx.fillRect(x-3,111,6,78);ctx.fillRect(x-22,147,44,7)}
 ctx.fillStyle='#544437';ctx.fillRect(0,394,W,H-394);ctx.strokeStyle='#88704e';ctx.lineWidth=3;for(let x=0;x<W;x+=110){ctx.beginPath();ctx.moveTo(x,394);ctx.lineTo(x-45,H);ctx.stroke()}for(let y=415;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.fillStyle='#241d1b';ctx.fillRect(0,417,W,9)}
function drawFighter(a){ctx.save();ctx.translate(a.x,a.y);ctx.scale(a.face,1);ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,1,35,9,0,0,Math.PI*2);ctx.fill();let action=a.attack?'attack':a.block?'block':a.y<FLOOR?'jump':Math.abs(a.vx)>1?'walk':'idle';let arr=sprites[action],index=action==='block'?1:action==='attack'?Math.min(arr.length-1,Math.floor((.37-a.attack)/.37*arr.length)):Math.floor(a.anim*(action==='walk'?11:4))%arr.length;let img=arr[index];
 if(a.master&&masterAtlas.complete&&masterAtlas.naturalWidth){const meta=masterActions[action==='attack'?'light':action]||masterActions.idle;const [row,count,fps]=meta;let idx=action==='attack'?Math.min(count-1,Math.floor((.37-a.attack)/.37*count)):action==='block'?2:Math.floor(a.anim*fps)%count;ctx.globalAlpha=a.inv>0&&Math.floor(a.inv*20)%2===0?.55:1;ctx.imageSmoothingEnabled=false;ctx.drawImage(masterAtlas,idx*112,row*112,112,112,-70,-158,140,158);ctx.imageSmoothingEnabled=true}
 else if(a.master){ctx.fillStyle='#f6e3ad';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.scale(a.face,1);ctx.fillText('MASTER IMAGE NOT LOADED',0,-160);ctx.scale(a.face,1);ctx.fillStyle='#61466e';ctx.fillRect(-19,-107,38,82)}else if(img&&img.complete&&img.naturalWidth){ctx.globalAlpha=a.inv>0&&Math.floor(a.inv*20)%2===0?.55:1;ctx.drawImage(img,-53,-142,106,142);if(a.master){ctx.globalCompositeOperation='source-atop';ctx.fillStyle='#573d78aa';ctx.fillRect(-53,-142,106,142);ctx.globalCompositeOperation='source-over'}}else{ctx.fillStyle=a.master?'#61466e':'#567a96';ctx.fillRect(-19,-107,38,82);ctx.fillStyle='#d6bd94';ctx.beginPath();ctx.arc(0,-124,19,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e5e0d0';ctx.fillRect(16,-90,56,5)}ctx.restore()}
function health(x,y,name,value){ctx.fillStyle='#111a24d9';ctx.fillRect(x,y,280,43);ctx.fillStyle='#d8c797';ctx.font='bold 15px system-ui';ctx.textAlign='left';ctx.fillText(name,x+9,y+16);ctx.fillStyle='#542c2a';ctx.fillRect(x+9,y+23,262,12);ctx.fillStyle='#a6be72';ctx.fillRect(x+9,y+23,262*value/100,12)}
function render(){drawBackdrop();if(player&&master){drawFighter(player);drawFighter(master);health(20,12,'SWORDSMAN',player.hp);health(660,12,'DOJO MASTER',master.hp)}for(const p of particles){ctx.globalAlpha=clamp(p.t*2,0,1);ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillStyle=p.color;ctx.fillText(p.text,p.x,p.y-25+(1-p.t)*-28)}ctx.globalAlpha=1;hud.textContent=state==='fight'?'TIME '+Math.ceil(clock)+'s · POINTS '+points+' · EXP POTENTIAL '+Math.max(10,Math.floor(points/2)): 'Coins '+currency+' · EXP '+exp}
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.querySelectorAll('[data-key]').forEach(b=>{const key=b.dataset.key;function down(e){e.preventDefault();b.setPointerCapture?.(e.pointerId);held.add(key);b.classList.add('pressed')}function up(e){e.preventDefault();held.delete(key);b.classList.remove('pressed')}b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});
const keys={a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right',j:'attack',k:'block',' ':'jump',ArrowUp:'jump'};document.addEventListener('keydown',e=>{let k=keys[e.key];if(k){e.preventDefault();held.add(k)}});document.addEventListener('keyup',e=>{let k=keys[e.key];if(k){e.preventDefault();held.delete(k)}});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});showMenu();
</script></body></html>
