<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Link's Adventure — Ancient Outpost 0.22</title><style>body{margin:0;background:#101a20;color:#f1e7ce;font:14px system-ui;text-align:center}h2{margin:12px}canvas{width:min(100%,1100px);aspect-ratio:16/9;display:block;margin:auto;image-rendering:pixelated;background:#263b42;border:3px solid #b99b64;box-shadow:0 18px 55px #000a}#controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px}button{font:600 15px system-ui;background:#35484c;color:white;border:1px solid #b5a77c;border-radius:7px;padding:12px 17px;touch-action:none}p{margin:8px}</style><h2>LINK'S ADVENTURE <small>v0.22 • Ancient Outpost</small></h2><canvas id="game" width="960" height="540"></canvas><p>A/D move · W/Space jump · J attack · K shield · L spin · E interact · R restart</p><div id="controls"><button data-k="a">◀</button><button data-k="d">▶</button><button data-k="w">JUMP</button><button data-k="j">SWORD</button><button data-k="k">SHIELD</button><button data-k="l">SPIN</button><button data-k="e">USE</button><button id="restart">RESTART</button></div><script>
(()=>{const cv=document.getElementById('game'),c=cv.getContext('2d'),W=960,H=540,G=440,LEN=3600;let keys={},player,enemies,plats,chests,lever,gate,checkpoint,arrows,fx,camera,frame,won,dead,notice;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const held=k=>!!keys[k];const rect=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};const poly=(pts,col)=>{c.fillStyle=col;c.beginPath();c.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)c.lineTo(...pts[i]);c.closePath();c.fill()};const ellipse=(x,y,rx,ry,col)=>{c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()};const line=(pts,col,w=3)=>{c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)c.lineTo(...pts[i]);c.stroke()};const label=(txt,x,y,size=14,col='#f8ebc8')=>{c.fillStyle=col;c.font=`bold ${size}px system-ui`;c.textAlign='center';c.fillText(txt,x,y)};function reset(){player={x:75,y:G-60,w:30,h:60,vx:0,vy:0,face:1,hp:20,energy:100,inv:0,stun:0,attack:0,cool:0,spin:0,shield:false,ground:true,treasure:0};enemies=[{type:'grunt',x:520,y:G-54,h:54,w:34,hp:3,home:520,dir:-1,state:'walk',timer:0,flash:0},{type:'guard',x:1110,y:G-62,h:62,w:42,hp:5,home:1110,dir:-1,state:'guard',timer:0,flash:0},{type:'archer',x:1570,y:300-54,h:54,w:34,hp:2,home:1570,dir:-1,state:'watch',timer:80,flash:0},{type:'grunt',x:2060,y:G-54,h:54,w:34,hp:3,home:2060,dir:-1,state:'walk',timer:0,flash:0},{type:'guard',x:2780,y:G-62,h:62,w:42,hp:5,home:2780,dir:-1,state:'guard',timer:0,flash:0}];plats=[{x:320,y:365,w:200},{x:650,y:310,w:170},{x:1430,y:355,w:260},{x:1510,y:300,w:175},{x:1860,y:365,w:190},{x:2420,y:350,w:210},{x:3040,y:350,w:185}];chests=[{x:425,y:337,open:false},{x:1950,y:337,open:false},{x:2480,y:322,open:false}];lever={x:2940,on:false};gate={x:3060,open:false};checkpoint={x:2160,active:false};arrows=[];fx=[];camera=0;frame=0;won=false;dead=false;notice='ANCIENT OUTPOST  •  Find the lever and breach the gate';}reset();document.getElementById('restart').onclick=reset;document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(k))e.preventDefault();if(k==='r')reset();keys[k==='arrowleft'?'a':k==='arrowright'?'d':k==='arrowup'?'w':k===' '?'w':k]=true});document.addEventListener('keyup',e=>{let k=e.key.toLowerCase();keys[k==='arrowleft'?'a':k==='arrowright'?'d':k==='arrowup'?'w':k===' '?'w':k]=false});document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;for(const [event,val] of [['pointerdown',true],['pointerup',false],['pointercancel',false],['pointerleave',false]])b.addEventListener(event,e=>{e.preventDefault();keys[k]=val})});function impact(x,y,col='#f7d57a'){for(let i=0;i<10;i++)fx.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:18,col})}function hurtPlayer(n,from){if(player.inv||player.shield&&Math.sign(from-player.x)===player.face)return;player.hp-=n;player.inv=62;player.stun=15;player.vx=Math.sign(player.x-from)*5;impact(player.x+15,player.y+24,'#f18b74');if(player.hp<=0){dead=true;notice='Defeated • Press R to restart'}}function swing(){if(player.cool||player.stun)return;player.attack=17;player.cool=27;let hx=player.x+player.w/2+player.face*38,hy=player.y+27;for(let e of enemies){if(e.hp<=0||Math.abs(e.x+e.w/2-hx)>57||Math.abs(e.y+e.h/2-hy)>55)continue;let front=(player.x+player.w/2-e.x-e.w/2)*e.dir>0;if(e.type==='guard'&&front&&e.state!=='exposed'&&e.state!=='stagger'){e.state='windup';e.timer=30;notice='BLOCKED! Guard draws sword back. Block or evade the counter.';impact(e.x+e.w/2,e.y+25,'#a9d4f2');continue}e.hp--;e.flash=10;e.state='stagger';e.timer=22;e.x+=player.face*25;impact(e.x+15,e.y+22);if(e.hp<=0){notice='Enemy defeated';impact(e.x+15,e.y+24,'#a5d68b')}}}function spin(){if(player.energy<45||player.spin||player.stun)return;player.energy-=45;player.spin=24;player.cool=28;for(let e of enemies)if(e.hp>0&&Math.abs(e.x-player.x)<90&&Math.abs(e.y-player.y)<85){e.hp-=2;e.flash=10;e.state='stagger';e.timer=24;impact(e.x,e.y)}}function interact(){for(let ch of chests)if(!ch.open&&Math.abs(player.x-ch.x)<80){ch.open=true;player.treasure++;player.hp=Math.min(20,player.hp+4);player.energy=Math.min(100,player.energy+30);notice='Treasure collected • Health and energy restored';return}if(Math.abs(player.x-checkpoint.x)<75){checkpoint.active=true;notice='Checkpoint activated';return}if(Math.abs(player.x-lever.x)<70){lever.on=true;gate.open=true;notice='Stronghold gate unlocked';return}}let prev={};function just(k){return held(k)&&!prev[k]}function update(){if(dead||won)return;frame++;if(just('j'))swing();if(just('l'))spin();if(just('e'))interact();player.shield=held('k')&&!player.attack&&!player.spin&&!player.stun;if(player.cool)player.cool--;if(player.attack)player.attack--;if(player.spin)player.spin--;if(player.inv)player.inv--;if(player.stun)player.stun--;player.energy=Math.min(100,player.energy+.09);if(!player.stun){let mv=(held('d')?1:0)-(held('a')?1:0);player.vx=mv*(player.shield?1.7:4.3);if(mv)player.face=mv;if(just('w')&&player.ground){player.vy=-12.5;player.ground=false}}player.x=clamp(player.x+player.vx,0,LEN-player.w);let oldBottom=player.y+player.h;player.vy=Math.min(14,player.vy+.62);player.y+=player.vy;player.ground=false;if(player.y+player.h>=G){player.y=G-player.h;player.vy=0;player.ground=true}for(let p of plats){if(player.vy>=0&&oldBottom<=p.y+7&&player.y+player.h>=p.y&&player.x+player.w>p.x+5&&player.x<p.x+p.w-5){player.y=p.y-player.h;player.vy=0;player.ground=true}}if(!gate.open&&player.x+player.w>gate.x&&player.x<gate.x+30)player.x=gate.x-player.w;if(player.x>LEN-145){won=true;notice='OUTPOST CLEARED • Victory!'}for(let e of enemies){if(e.hp<=0)continue;if(e.flash)e.flash--;let dist=player.x-e.x,near=Math.abs(dist)<340,vertical=Math.abs((player.y+player.h/2)-(e.y+e.h/2));if(e.type==='archer'){if(e.state==='watch'){e.timer--;if(e.timer<=0&&near&&player.y+player.h<G-15){e.state='aim';e.timer=58;e.dir=Math.sign(dist)||1}}else if(e.state==='aim'){e.timer--;if(e.timer===0){arrows.push({x:e.x+e.w/2,y:e.y+19,vx:e.dir*6.3});e.state='cooldown';e.timer=300}}else if(e.state==='cooldown'){if(--e.timer<=0){e.state='watch';e.timer=35}}continue}if(e.state==='stagger'){if(--e.timer<=0){e.state=e.type==='guard'?'exposed':'walk';e.timer=e.type==='guard'?58:0}continue}if(e.type==='guard'){if(e.state==='windup'){e.dir=Math.sign(dist)||e.dir;if(--e.timer<=0){e.state='strike';e.timer=15;e.connected=false}}else if(e.state==='strike'){if(e.timer===10&&!e.connected&&Math.abs(dist)<105&&vertical<60){hurtPlayer(3,e.x);e.connected=true}if(--e.timer<=0){e.state='exposed';e.timer=92;notice='GUARD EXPOSED! Shield lowered • Strike now!'}}else if(e.state==='exposed'){if(--e.timer<=0)e.state='guard'}else if(e.state==='guard'){e.dir=Math.sign(dist)||e.dir;if(near&&Math.abs(dist)<90&&vertical<65){e.state='windup';e.timer=34}}}else{if(e.state==='windup'){if(--e.timer<=0){e.state='strike';e.timer=12;e.connected=false}}else if(e.state==='strike'){if(e.timer===7&&!e.connected&&Math.abs(dist)<75&&vertical<60){hurtPlayer(2,e.x);e.connected=true}if(--e.timer<=0){e.state='recover';e.timer=45}}else if(e.state==='recover'){if(--e.timer<=0)e.state='walk'}else if(near&&vertical<65){e.dir=Math.sign(dist)||e.dir;if(Math.abs(dist)>65)e.x+=e.dir*1.3;else{e.state='windup';e.timer=26}}}}for(let a of arrows){a.x+=a.vx;if(Math.abs(a.x-player.x-15)<20&&Math.abs(a.y-player.y-25)<35){hurtPlayer(2,a.x-a.vx*3);a.dead=true}for(let p of plats)if(a.x>p.x&&a.x<p.x+p.w&&Math.abs(a.y-p.y)<8)a.dead=true}arrows=arrows.filter(a=>!a.dead&&Math.abs(a.x-player.x)<950);for(let f of fx){f.x+=f.vx;f.y+=f.vy;f.life--}fx=fx.filter(f=>f.life>0);camera=clamp(player.x-W*.37,0,LEN-W);prev={...keys}}// Painted, deterministic world layers: forest perimeter, masonry, torches, ruins and fortress.
const rand=n=>{let x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};
function stoneBlock(x,y,w,h,seed=0,lit=0){
 rect(x,y,w,h,lit?'#58605c':'#414e4c');rect(x+2,y+2,w-4,h-5,lit?'#788078':'#596663');
 rect(x+2,y+2,w-4,2,lit?'#9b9c83':'#7b8a7c');rect(x+3,y+h-6,w-6,3,'#303c3b');
 for(let i=0;i<3;i++){let px=x+5+rand(seed+i*13)*(w-12),py=y+6+rand(seed+i*17+1)*(h-14);rect(px,py,2+rand(seed+i)*5,1,'#293b3b')}
}
function wallSection(x,y,w,h,seed=0){
 rect(x,y,w,h,'#364543');rect(x+5,y+5,w-10,h-9,'#4b5b55');
 for(let row=0;row<Math.ceil(h/24);row++){let yy=y+row*24,off=(row%2)*29;for(let xx=x-off;xx<x+w;xx+=58){let bx=Math.max(x,xx),bw=Math.min(x+w,xx+56)-bx;if(bw>4&&yy<y+h)stoneBlock(bx,yy,bw,Math.min(23,y+h-yy),seed+row*37+xx)}}
}
function pine(x,base,h,shade){rect(x-8,base-h*.67,16,h*.67,'#293b35');for(let k=0;k<4;k++){let yy=base-h+k*h*.22;poly([[x,yy],[x-h*.27+k*2,yy+h*.37],[x+h*.27-k*2,yy+h*.37]],shade)}}
function torch(x,y,scale=1){c.save();c.translate(x,y);c.scale(scale,scale);rect(-5,0,10,28,'#222e2e');rect(-12,-4,24,7,'#99835b');rect(-8,-8,16,5,'#d3b274');let flick=Math.sin(frame*.18+x)*3;ellipse(0,-16+flick,11,18,'#f0a74e');ellipse(0,-17+flick,6,13,'#ffdf8a');ellipse(0,-20+flick,3,7,'#fff3c4');c.restore()}
function bg(){let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101d2b');g.addColorStop(.55,'#2c4149');g.addColorStop(1,'#53645a');rect(0,0,W,H,g);
 // moonlight, diffuse atmosphere
 let halo=c.createRadialGradient(780,90,3,780,90,190);halo.addColorStop(0,'#d9d6aa65');halo.addColorStop(1,'#d9d6aa00');rect(575,0,385,300,halo);ellipse(782,91,31,31,'#d6d2b0');
 for(let i=0;i<45;i++){let x=rand(i+4)*W,y=rand(i+81)*210;rect(x,y,1.5,1.5,'#c4d3c2')}
 // distant mountains and silhouettes
 for(let l=0;l<3;l++){let shift=camera*[.07,.13,.21][l],col=['#263941','#29413f','#24413b'][l];c.fillStyle=col;c.beginPath();c.moveTo(-50,H);for(let x=-100;x<W+200;x+=70){let yy=260+l*45+rand(Math.floor((x+shift)/70)+l*500)*85;c.lineTo(x-(shift%70),yy)}c.lineTo(W+100,H);c.fill()}
 for(let layer=0;layer<3;layer++){let par=[.14,.27,.43][layer];for(let i=-2;i<28;i++){let x=i*112-camera*par;let hh=150+rand(i*9+layer*100)*130;pine(x,G+30,hh,['#1c3837','#193a36','#18372f'][layer])}}
 // fortress approaches in the far midground
 for(let i=0;i<9;i++){let x=i*490+360-camera*.62;if(x<-240||x>W+240)continue;wallSection(x,245,165,196,i*100);rect(x-8,228,182,22,'#67746a');for(let k=0;k<5;k++)rect(x+k*38,209,26,25,'#69746a');rect(x+60,290,48,150,'#25383b');poly([[x+55,291],[x+84,255],[x+113,291]],'#788078');rect(x+75,310,12,80,'#182e32');}
 // playfield stone paving and moss
 rect(0,G,W,H-G,'#273a37');rect(0,G,W,12,'#6b7961');rect(0,G+10,W,7,'#404f44');
 for(let i=0;i<55;i++){let wx=i*87,xx=wx-camera;if(xx<-100||xx>W+100)continue;stoneBlock(xx,G+17+(i%3)*18,86,18,i*3);if(i%3===0){rect(xx+7,G+11,25,3,'#5d8062');rect(xx+31,G+8,14,4,'#78936a')}}
 // soft drifting fog bands
 for(let i=0;i<6;i++){let x=(i*250+Math.sin(frame*.004+i)*28-camera*.08)%1250;ellipse(x,G-15+(i%2)*14,190,18,'#9caea012')}
}
function decor(){
 // foreground architectural outpost structures, with masonry, pillars and arches
 for(let i=0;i<8;i++){let x=145+i*480;if(x>LEN-250)break;
 wallSection(x,G-158,45,158,i*5);rect(x-11,G-170,68,18,'#92988a');rect(x-7,G-182,60,12,'#505e56');

 if(i%2===0){rect(x+46,G-157,190,18,'#66766b');rect(x+50,G-141,184,8,'#3b4d47');for(let k=0;k<5;k++)stoneBlock(x+48+k*38,G-164,37,16,i+k);}
 torch(x+28,G-126,.8);
 }
 // ruined high tower, distinct level landmark
 wallSection(820,G-255,134,255,321);rect(809,G-269,157,24,'#7b8779');for(let k=0;k<5;k++)rect(816+k*32,G-291,21,29,'#8a9586');
 rect(856,G-218,49,88,'#26393b');poly([[851,G-218],[881,G-256],[911,G-218]],'#26393b');rect(869,G-203,10,66,'#14272b');
 // collapsed arches and vines near the later outpost
 wallSection(2280,G-205,48,205,411);wallSection(2620,G-205,48,205,412);rect(2280,G-214,388,25,'#6f7b6e');for(let i=0;i<10;i++)stoneBlock(2280+i*39,G-234,38,23,i+340);
 for(let i=0;i<24;i++){let x=2300+i*14,y=G-208+Math.sin(i*.9)*8;line([[x,y],[x+4,y+20+rand(i)*30]],'#355b46',2)}
 // massive gateway approach, visually unmistakable objective
 wallSection(3015,G-298,230,298,800);rect(3003,G-313,254,24,'#8b9486');for(let k=0;k<7;k++)rect(3012+k*35,G-340,24,32,'#9aa092');
 rect(3075,G-209,100,209,'#17292d');poly([[3075,G-207],[3125,G-264],[3175,G-207]],'#17292d');rect(3095,G-165,62,165,'#293b3c');
 for(let i=0;i<4;i++){let x=[470,1330,2240,2840][i];rect(x,G-115,6,110,'#6d5d47');poly([[x+6,G-113],[x+61,G-103],[x+6,G-52]],i%2?'#6c443f':'#46646a');rect(x+12,G-100,31,4,'#c3a56a')}

function scene(){c.save();c.translate(-camera,0);decor();for(let p of plats){rect(p.x,p.y,p.w,24,'#394942');for(let xx=p.x;xx<p.x+p.w;xx+=42)stoneBlock(xx,p.y,Math.min(41,p.x+p.w-xx),22,xx);rect(p.x,p.y,p.w,5,'#87947a');for(let xx=p.x+14;xx<p.x+p.w;xx+=73){rect(xx,p.y-4,24,5,'#587454');rect(xx+8,p.y-7,8,5,'#6e8d60')}}for(let ch of chests){rect(ch.x,ch.y,37,28,ch.open?'#6d6551':'#76522c');rect(ch.x,ch.y+2,37,8,ch.open?'#9e926a':'#c99b4b');rect(ch.x+15,ch.y+10,7,12,'#e5c96c');if(!ch.open&&Math.abs(player.x-ch.x)<90)label('E: OPEN',ch.x+20,ch.y-12,12)}rect(checkpoint.x,G-80,8,80,'#8b8d79');poly([[checkpoint.x+8,G-80],[checkpoint.x+56,G-67],[checkpoint.x+8,G-54]],checkpoint.active?'#dfc16a':'#5f8f9c');if(Math.abs(player.x-checkpoint.x)<85)label('E: CHECKPOINT',checkpoint.x+15,G-90,12);rect(lever.x,G-47,9,47,'#b1a786');line([[lever.x+5,G-46],[lever.x+(lever.on?28:-20),G-74]],'#e3c66b',7);if(Math.abs(player.x-lever.x)<75)label('E: LEVER',lever.x,G-93,13);if(!gate.open){rect(gate.x,G-206,36,206,'#313c40');for(let i=0;i<5;i++)rect(gate.x+i*7,G-206,4,206,'#9ba8a0');for(let i=0;i<7;i++)rect(gate.x,G-201+i*30,36,5,'#bd9c61');label('SEALED GATE',gate.x+15,G-228,14)}wallSection(LEN-158,G-238,150,238,944);rect(LEN-130,G-185,94,185,'#14272b');poly([[LEN-130,G-185],[LEN-83,G-231],[LEN-36,G-185]],'#14272b');rect(LEN-140,G-243,110,19,'#87917f');label('EXIT',LEN-85,G-258,16);for(let i=0;i<16;i++){let x=i*231+100;rect(x,G-3,5,6,'#607d59');rect(x+4,G-7,3,9,'#7b9664')}for(let e of enemies)if(e.hp>0)drawEnemy(e);for(let a of arrows){line([[a.x-12*Math.sign(a.vx),a.y],[a.x+10*Math.sign(a.vx),a.y]],'#d6c28c',3);poly([[a.x+12*Math.sign(a.vx),a.y],[a.x+4*Math.sign(a.vx),a.y-4],[a.x+4*Math.sign(a.vx),a.y+4]],'#d5d9d1')}drawHero();for(let f of fx)rect(f.x,f.y,4,4,f.col);c.restore()}function actor(x,y,dir,draw){c.save();c.translate(Math.round(x),Math.round(y));if(dir<0)c.scale(-1,1);draw();c.restore()}function heroShape(mode,t){let run=mode==='run',stride=run?Math.sin(t*.22)*10:0,jump=mode==='ju
