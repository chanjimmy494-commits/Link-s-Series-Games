function fx(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.8)*7,life:20+Math.random()*16,color})}function hurt(dmg,from){if(player.inv||player.shield&&Math.sign(from-player.x)===player.face)return;player.hp-=dmg;player.inv=48;player.stun=16;player.vx=from>player.x?-6:6;player.vy=-4;fx(player.x,player.y+30,'#f5b2a4');if(player.hp<=0){notice='Defeated. Press Restart';player.hp=0}}

for(const e of enemies){if(e.hp<=0)continue;let pose=e.state==='stagger'||e.state==='hurt'?'hurt':e.state==='windup'?'windup':e.state==='attack'?'attack':e.state==='block'?'block':e.state==='walk'?'walk':'idle';let h=e.type==='brute'?136:e.type==='archer'?92:110;sprite(e.type,pose,tick/(pose==='walk'?6:pose==='attack'?3:11),e.x,e.y,h,-e.dir);if(e.hp< (e.type==='brute'?6:e.type==='archer'?2:3)){ctx.fillStyle='#280c16';ctx.fillRect(e.x-20,e.y-h-12,40,5);ctx.fillStyle='#e66b63';ctx.fillRect(e.x-20,e.y-h-12,40*e.hp/(e.type==='brute'?6:e.type==='archer'?2:3),5)}}for(const a of arrows){ctx.strokeStyle='#e6d5aa';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x-a.vx*4,a.y);ctx.stroke()}let pose=player.stun?'block':player.heavy||player.attack?'attack':player.shield?'block':!player.ground?'jump':player.crouch?'block':Math.abs(player.vx)>3.5?'run':Math.abs(player.vx)>.4?'walk':'idle';let phase=pose==='attack'?(player.heavy?28-player.heavy:23-player.attack)/3:pose==='block'?1:tick/(pose==='run'?4:pose==='walk'?6:13);if(player.inv%6<3)sprite('hero',pose,phase,player.x+22,player.y+76,player.crouch?68:95,player.face);if(player.heavy>0){ctx.strokeStyle='#8de9ff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(player.x+22,player.y+43,74,(28-player.heavy)*.3,(28-player.heavy)*.3+1.4);ctx.stroke()}for(const p of particles){ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.restore();ctx.fillStyle='#0c1726e8';ctx.fillRect(0,0,W,61);ctx.fillStyle='#ebd6a7';ctx.font='bold 21px Georgia';ctx.fillText('ANCIENT OUTPOST',20,26);for(let i=0;i<5;i++){ctx.fillStyle=i<player.hp?'#e87877':'#42343e';ctx.fillRect(22+i*30,36,24,17)}ctx.font='14px Georgia';ctx.fillStyle='#e7d6b6';ctx.fillText('ENERGY',205,27);ctx.fillStyle='#2a3948';ctx.fillRect(205,36,145,15);ctx.fillStyle='#76c8df';ctx.fillRect(205,36,145*player.energy/100,15);ctx.fillStyle='#f3d4a2';ctx.fillText('TREASURE '+player.treasure+'/3',390,39);ctx.fillText('ENEMIES '+enemies.filter(e=>e.hp>0).length,690,39);ctx.fillStyle='#08111
